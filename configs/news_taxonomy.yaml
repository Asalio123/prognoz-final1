# ЗАМОРОЖЕНО ex-ante 04.10.2026 (коммит до любого прогона новостных фичей — анти-утечка, R07).
# 6 тематических индексов; мультилейбл (заголовок может попасть в несколько тем).
# Классификация: словарь ключевых фраз (интерпретируемо, проверяемо глазами); валидация rubert-tiny2 по Cohen's kappa.
topics:
  prices_inflation:      # канал: реальные доходы → потребление
    desc: "Цены, инфляция, подорожание/удешевление, ИПЦ"
    keywords: [инфляц, подорожа, удорожа, вздорожа, цены на, рост цен, снижени* цен, ИПЦ, индекс потребительских цен, дефляц]
  fx_ruble:              # канал: девальвация → ажиотажный спрос на непродовольствие (авг-2023) / провал (ноя-2024)
    desc: "Курс рубля, девальвация, валютный рынок"
    keywords: [девальвац, курс* рубл, курс* доллар, курс* евро, валютн* курс, рубл* упал, рубл* снизил, рубл* ослаб, рубл* укреп, рубл* подешев, рубл* подорож, ослаблени* рубл, укреплени* рубл]
  rate_credit:           # канал: ставка → кредиты/депозиты → потребление
    desc: "Ключевая ставка, кредиты, ипотека, вклады"
    keywords: [ключев* ставк, ставк* ЦБ, ставк* Центробанк, Банк России повыс*, Банк России пониз*, Банк России сохран*, ипотек*, ставк* по вклад, ставк* по депозит, ставк* по кредит]
  sanctions_shocks:      # канал: санкции/ограничения → отдельные категории
    desc: "Санкции, экспортные ограничения, отраслевые шоки"
    keywords: [санкци, запрет* на экспорт, эмбарго, параллельн* импорт]
  consumer_sentiment:    # канал: настроения → сбережения vs траты
    desc: "Потребительские настроения, сбережения, инфляционные ожидания"
    keywords: [потребительск* настроен, инфляционн* ожидан, норм* сбережен, расходы россиян, потребительск* активност*]
  emergencies_regional:  # канал: ЧС → локальные шоки (топонимы = кросс-секционная вариация)
    desc: "ЧС, паводки, пожары, региональные события"
    keywords: [паводок, наводнени, пожар, ЧС, эвакуац, дамб, прорыв, землетрясен, ураган, сход*]

# Правила информационного множества: новость доступна для прогноза origin O,
# если published_at <= конец месяца O-1 (assert-гейт в коде). Нормировка expanding, не corpus-wide.
