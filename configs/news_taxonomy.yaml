# ВЕРСИИ (честная шапка вместо «ЗАМОРОЖЕНО ex-ante 04.10» — аудит rc0, P1-3):
#   v1 — заморожена ex-ante 04.10.2026 (коммит b683980, до любого прогона новостного слоя).
#   v2 — 05.10.2026 (коммит a241e7d): сужение лексем 4 тем; валидирована по независимому
#        таймлайну шоков C3 (z-пики rate 2023-07/09, fx 2023-08/09), ДО первой оценки на таргете.
#   v3 — 06.10.2026: чистка по аудиту rc0 (A12_news_auditor, A03_kuznetsov), ДО перезапуска
#        абляции главным потоком. Изменения: geo-фильтр (ниже), fx_ruble и consumer_sentiment
#        переведены в retired (вырожденный объём), зафиксированы пороги min_volume.
#        В отчёт идёт v3 с этим журналом; v1→v2 дифф — в git.
# Классификация: словарь ключевых фраз, мультилейбл (заголовок может попасть в несколько тем;
# фактически 0.03% — лексиконы тем почти дизъюнктны, это свойство дизайна, см. отчёт FIX_A12).
# Валидация: ручная разметка n=50, κ словарь-vs-человек (outputs/news_kappa_v2.md).
# Ранее заявленная «валидация rubert-tiny2 по Cohen's kappa» НЕ проводилась — упоминание
# удалено как несуществующий артефакт (аудит P0-2).

# Гео-фильтр (аудит: ~15% хитов — иностранный контекст: «Инфляция в Германии», Турция,
# Газа, Йемен). Правило: заголовок с любым geo_exclude-стемом снимается с темы;
# для тем с geo: with_rescue хит сохраняется, если есть geo_rescue-маркер
# («санкции США против России» — релевантно; «санкции против сирийского конгломерата» — нет).
# Стемы lowercase, префиксные. Список собран по аудиторским сэмплам + прогону по корпусу —
# это итерация дизайна по корпусу (не по таргету), зафиксировано здесь до перезапуска абляции.
# Учтены двойные формы названий (Молдова/Молдавия, Польша/польский, Италия/итальянский...) —
# найдено κ-разметкой 06.10.2026.
geo_exclude: [германи, еврозон, евросоюз, европ, сша, америк, кита, япони, японск, инди, индонези,
              турци, сири, афганистан, афганск, пакистан, бангладеш, испани, испанск, итали, италь,
              франц, британ, англи, канад, австрали,
              бразили, аргентин, мексик, чили, перу, колумби, венесуэл, куб, сектор газ,
              израил, палестин, йемен, ливан, ливи, иран, ирак, египет, судан, эфиопи, нигери,
              кени, юар, марокко, тунис, алжир, украин, киев, белорус, беларус, казахстан, казахск,
              узбекистан, киргиз, кыргыз, таджик, туркмен, азербайджан, армени, армянск, грузи,
              грузинск, молдов, молдав, прибалтик, латви, литв, эстони, польш, польск, чехи, словак,
              венгри, румын, болгари, серби, хорвати, черногор, норвег, швец, финлянд, финск,
              дани, датск, нидерланд, бельги, австри, швейцар,
              португал, греци, кипр, коре, вьетнам, таиланд, малайзи, сингапур, гонконг,
              тайван, зеланд, ямайк, фрс, федрезерв, ецб, уефа]
geo_rescue: [росс, рф, рубл, кремл, путин, банк россии, центробанк, госдум, росстат, минэк]

# Пороги объёма (аудит: z-пики на 2-7 заголовках = пуассоновский шум).
min_volume:
  z_min_count: 5             # z-score считается только при count >= 5 за месяц, иначе NaN
  topic_min_total: 48        # тема входит в фичи при >= 48 хитов суммарно (mean >= 2/мес)
  topic_min_active_months: 12  # и >= 12 ненулевых месяцев из 24

topics:
  prices_inflation:      # канал: реальные доходы → потребление
    desc: "Цены, инфляция, подорожание/удешевление, ИПЦ"
    status: active
    geo: exclude_only
    keywords: [инфляц, подорожа, удорожа, вздорожа, цены на, рост цен, снижени* цен, ИПЦ, индекс потребительских цен, дефляц]
  fx_ruble:              # канал: девальвация → ажиотажный спрос (авг-2023) / провал (ноя-2024)
    desc: "Курс рубля, девальвация, валютный рынок"
    status: retired      # 37 хитов/24 мес (7 месяцев = 0); расширение лексем даёт +22 хита, но шум
                         # (УЕФА, Казахстан) — тема ниже topic_min_total, из фичей удалена (аудит P0-1).
                         # Канал частично покрывается rate_credit (внеплановая ставка 08.2023) и sanctions.
    geo: exclude_only
    keywords: [девальвац, курс* рубл, курс* доллар, курс* евро, валютн* курс, рубл* упал, рубл* снизил, рубл* ослаб, рубл* укреп, рубл* подешев, рубл* подорож, ослаблени* рубл, укреплени* рубл]
  rate_credit:           # канал: ставка → кредиты/депозиты → потребление
    desc: "Ключевая ставка, кредиты, ипотека, вклады"
    status: active
    geo: exclude_only
    keywords: [ключев* ставк, ставк* ЦБ, ставк* Центробанк, Банк России повыс*, Банк России пониз*, Банк России сохран*, ипотек*, ставк* по вклад, ставк* по депозит, ставк* по кредит]
  sanctions_shocks:      # канал: санкции/ограничения → отдельные категории
    desc: "Санкции, экспортные ограничения, отраслевые шоки"
    status: active
    geo: with_rescue     # «санкции ЕС против РФ» релевантны; «санкции против сирийского…» — нет
    keywords: [санкци, запрет* на экспорт, эмбарго, параллельн* импорт]
  consumer_sentiment:    # канал: настроения → сбережения vs траты
    desc: "Потребительские настроения, сбережения, инфляционные ожидания"
    status: retired      # 3 хита/24 мес; расширение (реальные доходы/зарплаты, ожидания ЦБ) даёт 17 —
                         # всё равно вырождена. Замена — внешний ряд инфляционных ожиданий ЦБ
                         # (ежемесячно) — за пределами этого фикса (аудит A03, P0-1).
    geo: exclude_only
    keywords: [потребительск* настроен, инфляционн* ожидан, норм* сбережен, расходы россиян, потребительск* активност*]
  emergencies_regional:  # канал: ЧС → локальные шоки (топонимы = кросс-секционная вариация)
    desc: "ЧС, паводки, пожары, региональные события"
    status: active
    geo: exclude_only    # ЧС в РФ обычно без слова «Россия» («паводок в Орске») — rescue не нужен,
                         # иностранные ЧС всегда с топонимом («землетрясение в Турции») — exclude ловит
    keywords: [паводок, наводнени, пожар, ЧС, эвакуац, дамб, прорыв, землетрясен, ураган, сход*]

# Правила информационного множества: новость доступна для прогноза origin O,
# если published_at <= конец месяца O-1. Нормировка expanding, не corpus-wide.
# TODO (главный поток): формализовать assert-гейт в коде мержа (аудит P0-2: заявлен, отсутствует).
